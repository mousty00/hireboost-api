spring:
  application:
    name: core-service

# ORM
  jpa:
    hibernate:
      ddl-auth: validate
    open-in-view: false

# POSTGRES DB
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

# FLYWAY
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true # means if your database is empty, Flyway will create its tracking table and mark your current database state as version 1
    baseline-version: 1    # Starting version number

# SWAGGER
springdoc:
  swagger-ui:
    default-models-expand-depth: -1
