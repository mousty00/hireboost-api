spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: auth-service
              uri: http://localhost:8081
              predicates:
                - Path=/auth/**

            - id: core-service
              uri: http://localhost:8082
              predicates:
                - Path=/core/**

            - id: ai-service
              uri: http://localhost:8083
              predicates:
                - Path=/ai/**



server:
  port: 8080
